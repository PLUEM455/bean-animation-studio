<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
(function () {
'use strict';
const W = 1280, H = 720;
const FONT = 'Itim, "Noto Sans Thai", "Leelawadee UI", sans-serif';
const INK = 0x1d0f3b, CREAM = 0xfff6e0;
const SEATC = [0xff5a6e, 0x3fa7ff, 0xffd23f, 0x3ddc84];
const NAMES = ['ถั่วแดง', 'ถั่วฟ้า', 'ถั่วเหลือง', 'ถั่วเขียว'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------------- storage ---------------- */
const Store = {
  d: null,
  load() {
    if (this.d) return this.d;
    let d = null;
    try { d = JSON.parse(localStorage.getItem('bean-party-v1') || 'null'); } catch (e) {}
    d = d || {};
    d.set = Object.assign({ tut: 'first', sfx: true, rounds: 5 }, d.set || {});
    d.seen = d.seen || {}; d.rank = d.rank || {}; d.solo = d.solo || 0;
    this.d = d; return d;
  },
  save() { try { localStorage.setItem('bean-party-v1', JSON.stringify(this.d)); } catch (e) {} }
};

/* ---------------- sound (synthesized) ---------------- */
const Snd = {
  ac: null,
  init() {
    if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  tone(f, d, type, v, f2, delay) {
    if (!Store.load().set.sfx || !this.ac) return;
    const a = this.ac, t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
  },
  noise(d, v) {
    if (!Store.load().set.sfx || !this.ac) return;
    const a = this.ac, len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = v; s.connect(g); g.connect(a.destination); s.start();
  },
  play(n) {
    switch (n) {
      case 'tap': this.tone(660, .08, 'square', .06, 880); break;
      case 'good': this.tone(660, .1, 'triangle', .14, 1000); break;
      case 'bad': this.tone(220, .28, 'sawtooth', .12, 80); break;
      case 'boom': this.noise(.5, .35); this.tone(130, .45, 'sine', .3, 38); break;
      case 'throw': this.tone(320, .16, 'triangle', .12, 760); break;
      case 'dash': this.tone(240, .2, 'sawtooth', .07, 640); break;
      case 'boing': this.tone(170, .22, 'sine', .2, 440); break;
      case 'fall': this.tone(520, .55, 'sine', .14, 70); break;
      case 'count': this.tone(520, .14, 'square', .09); break;
      case 'go': this.tone(780, .4, 'square', .1, 1150); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'triangle', .14, null, i * .12)); break;
    }
  }
};

/* ---------------- controls: 4 corner seats, joystick + one button, multitouch ---------------- */
const SEATPOS = [
  { jx: 140, jy: 140, bx: 340, by: 140 }, { jx: 1140, jy: 140, bx: 940, by: 140 },
  { jx: 140, jy: 580, bx: 340, by: 580 }, { jx: 1140, jy: 580, bx: 940, by: 580 }
];
const JR = 80, BR = 56;
const KEYS = [
  { l: 'KeyA', r: 'KeyD', u: 'KeyW', d: 'KeyS', b: 'Space' },
  { l: 'ArrowLeft', r: 'ArrowRight', u: 'ArrowUp', d: 'ArrowDown', b: 'Enter' }
];
const Ctl = {
  n: 0, cfg: { joy: false, btn: false }, enabled: false, st: [], map: new Map(), cool: [0, 0, 0, 0], keys: {}, kp: [false, false, false, false], canvas: null,
  mk() { return { x: 0, y: 0, kx: 0, ky: 0, joyId: null, btnId: null, btn: false, pressed: false }; },
  reset() { this.st = [0, 1, 2, 3].map(() => this.mk()); this.map.clear(); this.cool = [0, 0, 0, 0]; },
  setup(n, cfg) { this.reset(); this.n = n; this.cfg = cfg; this.enabled = true; },
  off() { this.reset(); this.n = 0; this.enabled = false; },
  toGame(e) { const r = this.canvas.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; },
  down(e) {
    if (!this.enabled) return;
    const [x, y] = this.toGame(e); let best = null, bd = 1e9;
    for (let i = 0; i < this.n; i++) {
      const L = SEATPOS[i], s = this.st[i];
      if (this.cfg.joy && s.joyId == null) { const d = Math.hypot(x - L.jx, y - L.jy); if (d < 130 && d < bd) { bd = d; best = [i, 'j']; } }
      if (this.cfg.btn && s.btnId == null) { const d = Math.hypot(x - L.bx, y - L.by); if (d < 90 && d < bd) { bd = d; best = [i, 'b']; } }
    }
    if (!best) return;
    const [i, k] = best, s = this.st[i];
    this.map.set(e.pointerId, { i, k });
    if (k === 'j') { s.joyId = e.pointerId; this.move(e); } else { s.btnId = e.pointerId; s.btn = true; s.pressed = true; }
    try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
  },
  move(e) {
    const m = this.map.get(e.pointerId); if (!m || m.k !== 'j') return;
    const L = SEATPOS[m.i], s = this.st[m.i], [x, y] = this.toGame(e);
    let dx = x - L.jx, dy = y - L.jy; const d = Math.hypot(dx, dy);
    if (d > JR) { dx *= JR / d; dy *= JR / d; }
    s.kx = dx; s.ky = dy;
    if (d < 14) { s.x = 0; s.y = 0; } else { s.x = dx / JR; s.y = dy / JR; }
  },
  up(e) {
    const m = this.map.get(e.pointerId); if (!m) return;
    this.map.delete(e.pointerId); const s = this.st[m.i];
    if (m.k === 'j') { s.joyId = null; s.x = s.y = s.kx = s.ky = 0; } else { s.btnId = null; s.btn = false; }
  },
  get(i) {
    const s = this.st[i]; let x = s.x, y = s.y, down = s.btn, pressed = s.pressed; const K = KEYS[i];
    if (K) {
      const k = this.keys, kx = (k[K.r] ? 1 : 0) - (k[K.l] ? 1 : 0), ky = (k[K.d] ? 1 : 0) - (k[K.u] ? 1 : 0);
      if (kx || ky) { const l = Math.hypot(kx, ky); x = kx / l; y = ky / l; }
      if (k[K.b]) down = true; if (this.kp[i]) pressed = true;
    }
    return { x, y, down, pressed };
  },
  endFrame() { this.st.forEach(s => s.pressed = false); this.kp = [false, false, false, false]; },
  init(canvas) {
    this.canvas = canvas; this.reset();
    canvas.addEventListener('pointerdown', e => this.down(e), { passive: false });
    canvas.addEventListener('pointermove', e => this.move(e), { passive: false });
    window.addEventListener('pointerup', e => this.up(e));
    window.addEventListener('pointercancel', e => this.up(e));
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
      if (!this.enabled) return;
      this.keys[e.code] = true;
      KEYS.forEach((K, i) => { if (K.b === e.code && !e.repeat) this.kp[i] = true; });
      if (/^(Arrow|Space|Enter)/.test(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
  }
};

/* ---------------- drawing helpers ---------------- */
function T(s, x, y, str, size, color, o) {
  o = o || {};
  const st = Object.assign({ fontFamily: FONT, fontSize: size + 'px', color: color || '#fff6e0', stroke: '#1d0f3b', strokeThickness: Math.max(3, Math.round(size / 7)), align: 'center' }, o.style || {});
  const t = s.add.text(x, y, str, st).setOrigin(o.ox == null ? .5 : o.ox, o.oy == null ? .5 : o.oy).setResolution(2);
  if (o.depth != null) t.setDepth(o.depth);
  return t;
}
function bgGrad(s, c1, c2) {
  const k = 'bg' + c1 + c2;
  if (!s.textures.exists(k)) {
    const ct = s.textures.createCanvas(k, 4, 256), x = ct.getContext(), gr = x.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2); x.fillStyle = gr; x.fillRect(0, 0, 4, 256); ct.refresh();
  }
  return s.add.image(W / 2, H / 2, k).setDisplaySize(W, H).setDepth(-100);
}
function Btn(s, x, y, w, h, label, cb, fill, size, o) {
  o = o || {};
  const c = s.add.container(x, y), g = s.add.graphics();
  g.fillStyle(INK, 1).fillRoundedRect(-w / 2, -h / 2 + 7, w, h, h / 3);
  g.fillStyle(fill == null ? 0xffd23f : fill, 1).fillRoundedRect(-w / 2, -h / 2, w, h, h / 3);
  g.lineStyle(4, INK, 1).strokeRoundedRect(-w / 2, -h / 2, w, h, h / 3);
  const t = T(s, 0, -2, label, size || 30, o.color || '#1d0f3b', { style: { strokeThickness: 0, wordWrap: { width: w - 20 } } });
  c.add([g, t]); c.setSize(w, h); c.setInteractive({ useHandCursor: true });
  c.on('pointerdown', () => { Snd.init(); s.tweens.add({ targets: c, scaleX: .93, scaleY: .93, duration: 70, yoyo: true }); });
  c.on('pointerup', () => { Snd.play('tap'); cb(c); });
  c.setLabel = l => t.setText(l); c.tint = fill => { g.clear(); g.fillStyle(INK, 1).fillRoundedRect(-w / 2, -h / 2 + 7, w, h, h / 3); g.fillStyle(fill, 1).fillRoundedRect(-w / 2, -h / 2, w, h, h / 3); g.lineStyle(4, INK, 1).strokeRoundedRect(-w / 2, -h / 2, w, h, h / 3); };
  return c;
}
function mkBean(s, i, x, y, sc) {
  sc = sc || 1;
  const sh = s.add.image(x, y + 44 * sc, 'shadow').setScale(sc).setDepth(2);
  const b = s.add.image(x, y, 'bean' + i).setScale(sc).setDepth(3);
  b.base = sc; b.sh = sh;
  b.put = (px, py) => { b.setPosition(px, py); sh.setPosition(px, py + 44 * b.base); };
  b.kill = () => { sh.destroy(); b.destroy(); };
  return b;
}
function squash(s, b, a) {
  s.tweens.add({ targets: b, scaleX: b.base * (a || 1.25), scaleY: b.base * .78, duration: 90, yoyo: true, ease: 'Sine.easeOut' });
}
function confetti(s, x, y, n, power) {
  for (let i = 0; i < n; i++) {
    const im = s.add.image(x, y, 'conf').setTint(Phaser.Utils.Array.GetRandom(SEATC.concat([0xffffff, 0xff9ff3]))).setDepth(800).setRotation(Math.random() * 6);
    const a = Math.random() * Math.PI * 2, sp = (120 + Math.random() * 380) * (power || 1);
    s.tweens.add({ targets: im, x: x + Math.cos(a) * sp, y: y + Math.sin(a) * sp + 220, rotation: im.rotation + 8, alpha: 0, duration: 900 + Math.random() * 800, ease: 'Cubic.easeOut', onComplete: () => im.destroy() });
  }
}
function pop(s, x, y, str, color, size) {
  const t = T(s, x, y, str, size || 38, color || '#fff6e0', { depth: 700 });
  t.setScale(.4); s.tweens.add({ targets: t, scale: 1, duration: 140, ease: 'Back.easeOut' });
  s.tweens.add({ targets: t, y: y - 70, alpha: 0, delay: 350, duration: 600, onComplete: () => t.destroy() });
}
function floaty(s) {
  for (let i = 0; i < 9; i++) {
    const b = s.add.image(rnd(0, W), rnd(0, H), 'bean' + (i % 4)).setAlpha(.16).setScale(rnd(.8, 1.7)).setAngle(rnd(0, 360)).setDepth(-50);
    s.tweens.add({ targets: b, y: b.y + rnd(-60, 60), angle: b.angle + rnd(-40, 40), duration: rnd(2500, 4500), yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
  }
}
/* tutorial drawing helpers (draw into container c, local coords) */
function addG(s, c) { const g = s.add.graphics(); c.add(g); return g; }
function jIcon(s, c, x, y) {
  const g = addG(s, c);
  g.fillStyle(0xffffff, .5).fillCircle(x, y, 50); g.lineStyle(5, INK, 1).strokeCircle(x, y, 50);
  g.fillStyle(0xff5a6e, 1).fillCircle(x + 14, y - 10, 24); g.lineStyle(4, INK, 1).strokeCircle(x + 14, y - 10, 24);
}
function bIcon(s, c, x, y, col) {
  const g = addG(s, c);
  g.fillStyle(col || 0xffd23f, 1).fillCircle(x, y, 40); g.lineStyle(5, INK, 1).strokeCircle(x, y, 40);
  g.fillStyle(0xffffff, .5).fillEllipse(x - 12, y - 14, 18, 10);
}
function img(s, c, key, x, y, sc) { const i = s.add.image(x, y, key).setScale(sc || 1); c.add(i); return i; }
function tx(s, c, x, y, str, color, size) { const t = T(s, x, y, str, size || 30, color || '#1d0f3b', { style: { strokeThickness: 0 } }); c.add(t); return t; }
function arrow(s, c, x1, y1, x2, y2, col) {
  const g = addG(s, c), a = Math.atan2(y2 - y1, x2 - x1);
  g.lineStyle(6, col || INK, 1).lineBetween(x1, y1, x2, y2);
  g.fillStyle(col || INK, 1).fillTriangle(x2, y2, x2 - Math.cos(a - .5) * 18, y2 - Math.sin(a - .5) * 18, x2 - Math.cos(a + .5) * 18, y2 - Math.sin(a + .5) * 18);
}

/* ---------------- textures ---------------- */
function starPts(cx, cy, ri, ro) { const a = []; for (let k = 0; k < 10; k++) { const r = k % 2 ? ri : ro, t = -Math.PI / 2 + k * Math.PI / 5; a.push({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r }); } return a; }
function makeTextures(s) {
  const mk = () => s.make.graphics({ x: 0, y: 0, add: false });
  SEATC.forEach((c, i) => {
    const g = mk();
    g.fillStyle(0x000000, 0);
    const dark = Phaser.Display.Color.IntegerToColor(c).darken(30).color;
    g.fillStyle(dark, 1).fillEllipse(24, 92, 22, 12).fillEllipse(48, 92, 22, 12);
    g.lineStyle(3, INK, 1).strokeEllipse(24, 92, 22, 12).strokeEllipse(48, 92, 22, 12);
    g.fillStyle(c, 1).fillEllipse(36, 52, 62, 78); g.lineStyle(4, INK, 1).strokeEllipse(36, 52, 62, 78);
    g.fillStyle(0xffffff, .38).fillEllipse(20, 28, 11, 22);
    g.fillStyle(0xffffff, 1).fillCircle(26, 44, 10).fillCircle(48, 44, 10);
    g.lineStyle(3, INK, 1).strokeCircle(26, 44, 10).strokeCircle(48, 44, 10);
    g.fillStyle(INK, 1).fillCircle(29, 46, 4.5).fillCircle(51, 46, 4.5);
    g.fillStyle(0xff7aa8, .55).fillCircle(15, 60, 5).fillCircle(59, 60, 5);
    g.lineStyle(3, INK, 1).beginPath(); g.arc(37, 62, 9, .25, Math.PI - .25); g.strokePath();
    g.generateTexture('bean' + i, 72, 104);
    const b = mk();
    b.fillStyle(0xb9773a, 1).fillPoints([{ x: 4, y: 10 }, { x: 96, y: 10 }, { x: 84, y: 44 }, { x: 16, y: 44 }], true);
    b.lineStyle(3, 0x6d4220, 1); for (let k = 1; k < 5; k++) b.lineBetween(4 + k * 18, 12, 16 + k * 14, 43);
    b.lineStyle(4, INK, 1).strokePoints([{ x: 4, y: 10 }, { x: 96, y: 10 }, { x: 84, y: 44 }, { x: 16, y: 44 }], true);
    b.fillStyle(c, 1).fillRoundedRect(0, 2, 100, 14, 7); b.lineStyle(4, INK, 1).strokeRoundedRect(0, 2, 100, 14, 7);
    b.generateTexture('basket' + i, 100, 48);
  });
  let g = mk();
  g.fillStyle(0xe83a4a, 1).fillCircle(28, 32, 22); g.lineStyle(4, INK, 1).strokeCircle(28, 32, 22);
  g.fillStyle(0xffffff, .45).fillEllipse(19, 22, 8, 12);
  g.fillStyle(0x3ddc84, 1).fillEllipse(34, 8, 16, 9); g.lineStyle(3, INK, 1).strokeEllipse(34, 8, 16, 9).lineBetween(28, 12, 28, 18);
  g.generateTexture('apple', 56, 56);
  g = mk(); g.fillStyle(0xffd23f, 1).fillPoints(starPts(28, 30, 12, 26), true); g.lineStyle(4, INK, 1).strokePoints(starPts(28, 30, 12, 26), true); g.fillStyle(0xffffff, .6).fillCircle(24, 24, 3); g.generateTexture('gold', 56, 58);
  g = mk(); g.fillStyle(0xa8b79a, 1).fillRoundedRect(14, 4, 22, 40, 8).fillRoundedRect(14, 32, 36, 18, 9);
  g.lineStyle(4, INK, 1).strokeRoundedRect(14, 4, 22, 40, 8).strokeRoundedRect(14, 32, 36, 18, 9);
  g.fillStyle(0x7ea36a, 1).fillRect(14, 8, 22, 6); g.fillStyle(0x66d27a, .8).fillCircle(8, 14, 4).fillCircle(44, 12, 3).fillCircle(4, 28, 3).fillCircle(48, 24, 4);
  g.generateTexture('sock', 56, 56);
  g = mk(); g.fillStyle(0x2a2540, 1).fillCircle(32, 44, 26); g.lineStyle(4, INK, 1).strokeCircle(32, 44, 26);
  g.fillStyle(0xffffff, .35).fillEllipse(22, 34, 10, 14); g.fillStyle(0x6d4220, 1).fillRect(29, 10, 6, 10);
  g.fillStyle(0xffd23f, 1).fillPoints(starPts(32, 8, 4, 9), true); g.lineStyle(3, INK, 1).strokeRect(29, 10, 6, 10);
  g.fillStyle(0xff5a6e, 1).fillCircle(40, 52, 4);
  g.generateTexture('bomb', 64, 74);
  g = mk(); g.fillStyle(0xffffff, 1).fillRect(0, 0, 12, 8); g.generateTexture('conf', 12, 8);
  g = mk(); g.fillStyle(0x000000, .28).fillEllipse(36, 8, 52, 14); g.generateTexture('shadow', 72, 16);
}

/* ---------------- pads (on-screen joystick + button) ---------------- */
class Pads {
  constructor(s, n, cfg) {
    this.s = s; this.n = n; this.cfg = cfg; this.g = s.add.graphics().setDepth(900); this.lab = [];
    for (let i = 0; i < n; i++) {
      const L = SEATPOS[i];
      if (cfg.btn) this.lab[i] = T(s, L.bx, L.by, typeof cfg.btn === 'string' ? cfg.btn : 'ปุ่ม', 26, '#1d0f3b', { depth: 901, style: { strokeThickness: 0 } });
    }
  }
  update() {
    const g = this.g; g.clear();
    for (let i = 0; i < this.n; i++) {
      const L = SEATPOS[i], st = Ctl.st[i], col = SEATC[i];
      if (this.cfg.joy) {
        g.fillStyle(col, .2).fillCircle(L.jx, L.jy, JR + 6); g.lineStyle(5, col, .75).strokeCircle(L.jx, L.jy, JR + 6);
        g.fillStyle(col, st.joyId != null ? .95 : .6).fillCircle(L.jx + st.kx, L.jy + st.ky, 34);
        g.lineStyle(4, INK, .8).strokeCircle(L.jx + st.kx, L.jy + st.ky, 34);
      }
      if (this.cfg.btn) {
        g.fillStyle(col, st.btn ? .95 : .45).fillCircle(L.bx, L.by, st.btn ? BR - 4 : BR);
        g.lineStyle(5, INK, .75).strokeCircle(L.bx, L.by, BR);
        const cl = Ctl.cool[i]; if (cl > 0) { g.fillStyle(INK, .55).slice(L.bx, L.by, BR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * cl, false); g.fillPath(); }
      }
    }
  }
}

/* ---------------- minigames ---------------- */
const CATCH = {

      this.add.image(hx, hy, 'bean' + i).setScale(.36).setDepth(850);
      this.scoreT[i] = T(this, hx + 46, hy, '0', 40, '#fff6e0', { depth: 850, ox: 0 });
    }
    this.timerT = T(this, W / 2, 86, String(def.dur), 44, '#fff6e0', { depth: 850 });
    const pb = this.add.circle(W / 2, 34, 25, CREAM).setStrokeStyle(4, INK).setDepth(950).setInteractive({ useHandCursor: true });
    T(this, W / 2, 33, 'II', 24, '#1d0f3b', { depth: 951, style: { strokeThickness: 0 } });
    pb.on('pointerup', () => this.pause());
    T(this, 28, 20, 'รอบ ' + S.round + '/' + S.rounds, 24, '#fff6e0', { depth: 850, ox: .0, oy: .5 }).setPosition(W / 2 + 70, 34).setOrigin(0, .5);
    const self = this;
    const c = {
      n, inp: i => Ctl.get(i), finish: () => self.finish(), cool: (i, f) => { Ctl.cool[i] = f; },
      setScore: (i, v) => { const t = self.scoreT[i]; if (t) { t.setText(String(v)); self.tweens.add({ targets: t, scale: { from: 1.5, to: 1 }, duration: 160 }); } }
    };
    this.inst = def.create(this, c);
    this.count(['3', '2', '1', 'ลุย!'], 0);
  }
  big(str, color) {
    const t = T(this, W / 2, H / 2 - 30, str, 170, color || '#ffd23f', { depth: 960, style: { strokeThickness: 16 } });
    t.setScale(1.7).setAlpha(0); this.tweens.add({ targets: t, scale: 1, alpha: 1, duration: 220, ease: 'Back.easeOut' });
    this.tweens.add({ targets: t, alpha: 0, scale: 1.25, delay: 520, duration: 260, onComplete: () => t.destroy() });
  }
  count(arr, k) {
    if (k >= arr.length) return;
    this.big(arr[k], k === arr.length - 1 ? '#3ddc84' : '#ffd23f'); Snd.play(k === arr.length - 1 ? 'go' : 'count');
    if (k === arr.length - 1) this.playing = true;
    this.time.delayedCall(800, () => this.count(arr, k + 1));
  }
  pause() { if (this.ended) return; Ctl.enabled = false; this.scene.launch('Pause'); this.scene.pause(); }
  finish() {
    if (this.ended) return; this.ended = true; this.playing = false;
    this.big('จบ!', '#ff5a6e');
    this.time.delayedCall(1300, () => { S.last = this.inst.scores(); Ctl.off(); this.scene.start('Results'); });
  }
  update(time, delta) {
    const dt = Math.min(delta / 1000, .05);
    if (this.playing) {
      this.elapsed += dt; this.inst.update(this.elapsed, dt);
      const rem = Math.max(0, this.def.dur - this.elapsed); this.timerT.setText(String(Math.ceil(rem)));
      if (rem <= 0) this.finish();
    }
    Ctl.endFrame(); this.pads.update();
  }
}

class Results extends Phaser.Scene {

  create() {
    Ctl.off(); const n = S.n, sc = S.last, rk = ranksOf(sc), def = S.def;
    bgGrad(this, '#3a1f7a', '#1d0f3b'); floaty(this);
    T(this, W / 2, 60, 'จบรอบที่ ' + S.round + ' · ' + def.title, 44, '#ffd23f');
    const order = sc.map((v, i) => i).sort((a, b) => rk[a] - rk[b] || a - b);
    const quips = ['เทพถั่วตัวจริง!', 'เกือบเป็นเทพ!', 'ยังพอไหว...', 'ถั่วเน่าประจำวัน'];
    order.forEach((i, row) => {
      const y = 190 + row * 100, pts = n > 1 ? n - rk[i] + 1 : sc[i];
      S.total[i] += pts;
      const g = this.add.graphics(); g.fillStyle(SEATC[i], 1).fillRoundedRect(250, y - 40, 780, 82, 24); g.lineStyle(5, INK, 1).strokeRoundedRect(250, y - 40, 780, 82, 24);
      const b = this.add.image(310, y, 'bean' + i).setScale(.62);
      T(this, 400, y, (n > 1 ? '#' + rk[i] + '  ' : '') + NAMES[i], 40, '#1d0f3b', { ox: 0, style: { strokeThickness: 0 } });
      T(this, 800, y, n > 1 ? quips[Math.min(rk[i] - 1, 3)] : 'ได้ ' + sc[i] + ' แต้ม', 28, '#1d0f3b', { style: { strokeThickness: 0 } });
      T(this, 975, y, '+' + pts, 46, '#fff6e0', { ox: 1 });
      g.setAlpha(0); b.setAlpha(0);
      this.tweens.add({ targets: [g, b], alpha: 1, x: { from: -80, to: 0 }, duration: 320, delay: 150 * row, ease: 'Back.easeOut' });
      if (rk[i] === 1 && n > 1) this.time.delayedCall(300, () => confetti(this, 310, y, 26, .9));
    });
    if (n > 1) Snd.play('win');
    const last = S.round >= S.rounds;
    Btn(this, W / 2, 640, 420, 78, last ? 'ดูผลรวม' : 'รอบต่อไป', () => last ? this.scene.start('MatchEnd') : nextRound(this), 0x3ddc84, 40);

}

class MatchEnd extends Phaser.Scene {
  constructor() { super('MatchEnd'); }
  create() {
    Ctl.off(); const n = S.n, tot = S.total, rk = ranksOf(tot), d = Store.load();
    bgGrad(this, '#3a1f7a', '#1d0f3b'); floaty(this);
    if (n > 1) tot.forEach((v, i) => { const r = d.rank[i] || (d.rank[i] = { matches: 0, wins: 0, pts: 0 }); r.matches++; r.pts += v; if (rk[i] === 1) r.wins++; });
    else d.solo = Math.max(d.solo || 0, tot[0]);
    Store.save();
    const order = tot.map((v, i) => i).sort((a, b) => rk[a] - rk[b] || a - b);
    T(this, W / 2, 70, n > 1 ? 'ผู้ชนะ!' : 'คะแนนรวมของคุณ', 80, '#ffd23f');
    order.forEach((i, row) => {
      const y = 200 + row * 100;
      const g = this.add.graphics(); g.fillStyle(SEATC[i], 1).fillRoundedRect(300, y - 40, 680, 82, 24); g.lineStyle(5, INK, 1).strokeRoundedRect(300, y - 40, 680, 82, 24);
      this.add.image(360, y, 'bean' + i).setScale(.62);
      T(this, 450, y, (n > 1 ? '#' + rk[i] + '  ' : '') + NAMES[i], 40, '#1d0f3b', { ox: 0, style: { strokeThickness: 0 } });
      T(this, 955, y, tot[i] + ' แต้ม', 44, '#fff6e0', { ox: 1 });
    });
    if (n === 1) T(this, W / 2, 330, 'สถิติเดี่ยวสูงสุด: ' + d.solo, 34);
    const w = order[0]; confetti(this, 640, 120, 70, 1.4); this.time.delayedCall(500, () => confetti(this, 300, 200, 40)); this.time.delayedCall(800, () => confetti(this, 980, 200, 40)); Snd.play('win');
    void w;
    Btn(this, 400, 640, 300, 70, 'เล่นอีกรอบ', () => startMatch(this, n), 0x3ddc84, 34);
    Btn(this, 740, 640, 220, 70, 'อันดับ', () => this.scene.start('Ranking'), 0xffd23f, 32);
    Btn(this, 1010, 640, 240, 70, 'หน้าหลัก', () => this.scene.start('Menu'), 0xfff6e0, 32);
  }
}

class Ranking extends Phaser.Scene {
  constructor() { super('Ranking'); }
  create() {
    Ctl.off(); const d = Store.load(); bgGrad(this, '#3a1f7a', '#1d0f3b'); floaty(this);
    T(this, W / 2, 70, 'อันดับถั่ว', 76, '#ffd23f');
    const rows = [0, 1, 2, 3].map(i => Object.assign({ i, matches: 0, wins: 0, pts: 0 }, d.rank[i] || {})).filter(r => r.matches > 0).sort((a, b) => b.wins - a.wins || b.pts - a.pts);
    if (!rows.length) T(this, W / 2, 300, 'ยังไม่มีใครแข่ง ไปเล่นกันก่อน!', 40);
    else {
      T(this, 700, 150, 'ชนะ', 28, '#fff6e0'); T(this, 820, 150, 'แมตช์', 28, '#fff6e0'); T(this, 950, 150, 'แต้มรวม', 28, '#fff6e0');
      rows.forEach((r, k) => {
        const y = 215 + k * 92, g = this.add.graphics(); g.fillStyle(SEATC[r.i], 1).fillRoundedRect(250, y - 38, 780, 76, 22); g.lineStyle(5, INK, 1).strokeRoundedRect(250, y - 38, 780, 76, 22);
        T(this, 295, y, String(k + 1), 44, '#1d0f3b', { style: { strokeThickness: 0 } });
        this.add.image(370, y, 'bean' + r.i).setScale(.55);
        T(this, 430, y, NAMES[r.i], 38, '#1d0f3b', { ox: 0, style: { strokeThickness: 0 } });
        T(this, 700, y, String(r.wins), 40, '#1d0f3b', { style: { strokeThickness: 0 } }); T(this, 820, y, String(r.matches), 40, '#1d0f3b', { style: { strokeThickness: 0 } }); T(this, 950, y, String(r.pts), 40, '#1d0f3b', { style: { strokeThickness: 0 } });
      });
    }
    T(this, W / 2, 590, 'สถิติเล่นเดี่ยวสูงสุด: ' + (d.solo || 0), 30);
    let arm = false;
    const rb = Btn(this, 1040, 660, 360, 60, 'ล้างอันดับ', () => {
      if (!arm) { arm = true; rb.setLabel('แน่ใจนะ? กดอีกที'); rb.tint(0xff5a6e); this.time.delayedCall(2500, () => { arm = false; if (rb.active) { rb.setLabel('ล้างอันดับ'); rb.tint(0xc9b6ff); } }); }

    Btn(this, 130, 660, 200, 60, '‹ กลับ', () => this.scene.start('Menu'), 0xfff6e0, 28);

    this.touch.setText('นิ้วที่แตะอยู่: ' + Ctl.map.size); Ctl.endFrame(); this.pads.update();
  }
}

/* ---------------- boot ---------------- */
function start() {
  const game = new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#1d0f3b',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 6 },
    render: { antialias: true, roundPixels: false },
    scene: [Boot, Menu, Lobby, Tutorial, Play, Pause, Results, MatchEnd, Ranking, Settings, Test]
  });
  game.events.once('ready', () => Ctl.init(game.canvas));
  window.__game = game; window.__S = S; window.__GAMES = GAMES; window.__Ctl = Ctl;
}
let started = false;
const go = () => { if (started) return; started = true; start(); };
try { document.fonts.load('32px Itim', 'ถั่วป่วน').then(go, go); } catch (e) { go(); }
setTimeout(go, 2500);
})();
